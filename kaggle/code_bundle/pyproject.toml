[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scale-error-yolo26"
version = "0.1.0"
description = "End-to-end YOLO26m industrial defect detection pipeline for Scale_Error_DC."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics==8.4.147",
    "roboflow==1.4.2",
    "iterative-stratification==0.1.9",
    "PyYAML>=6.0.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "sahi>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
demo = [
    "gradio>=5.0",
]

[project.scripts]
scale-error = "scale_error.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scale_error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
