name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inspector
          POSTGRES_PASSWORD: inspector
          POSTGRES_DB: inspector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inspector -d inspector_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://inspector:inspector@127.0.0.1:5432/inspector_test
      INSPECTOR_TEST_DATABASE_URL: postgresql+psycopg://inspector:inspector@127.0.0.1:5432/inspector_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0 torchvision==0.28.0
      - run: python -m pip install -e ".[dev,app]"
      - run: ruff check src tests scripts migrations app.py
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: pytest -q -rs --junitxml=pytest-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: pytest-results.xml
