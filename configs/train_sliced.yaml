model: yolo26m.pt
epochs: 15
imgsz: 960
batch: 16
device: 0
workers: 4

# Reproducibility
seed: 42
deterministic: true
patience: 10

# Precision
amp: true
cache: false

# Fine-tuning optimizer
optimizer: MuSGD
lr0: 0.0003
lrf: 0.20
momentum: 0.948
weight_decay: 0.00027
warmup_epochs: 1.0

# Sliced fine-tuning domain augmentations:
# Crucial: mosaic=0 to maintain 1:1 native spatial resolution on 960x960 tiles!
mosaic: 0.0
close_mosaic: 0
mixup: 0.0
copy_paste: 0.0
scale: 0.20
translate: 0.05
fliplr: 0.50
flipud: 0.0
degrees: 0.0
shear: 0.0
perspective: 0.0
hsv_h: 0.013
hsv_s: 0.353
hsv_v: 0.194

# Artifacts
plots: true
save: true
save_period: -1
val: true
verbose: true
