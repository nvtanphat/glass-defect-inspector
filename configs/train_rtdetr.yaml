model: rtdetr-l.pt
epochs: 120
imgsz: 960
batch: 8
device: 0
workers: 4

# Reproducibility / stopping
seed: 42
deterministic: false
patience: 40

# Precision / performance
amp: true
cache: false

# RT-DETR has no anchor/mosaic-sensitive small-object failure mode in the same
# way YOLO does, but this dataset's defects are still tiny, so keep augmentation
# mild and consistent with the YOLO26m run for a fair ensemble comparison.
mosaic: 0.0
scale: 0.50
translate: 0.10
fliplr: 0.50
flipud: 0.0
degrees: 0.0
shear: 0.0
perspective: 0.0
hsv_h: 0.013
hsv_s: 0.353
hsv_v: 0.194

# Artifacts
plots: true
save: true
save_period: -1
val: true
verbose: true
