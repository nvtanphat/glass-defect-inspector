model: yolo26m.pt
# Pipeline features consumed by scale_error.training.trainer (not Ultralytics).
preprocessing: roi_crop
roi_config: processing/roi_config.json
use_vfl: true
use_class_weights: true
epochs: 100
imgsz: 960
batch: 8
device: 0
workers: 4

# Reproducibility / stopping
seed: 42
deterministic: true
patience: 15

# Precision / performance
amp: true
cache: false

# YOLO26-M recipe-informed optimizer / losses
optimizer: MuSGD
lr0: 0.00038
lrf: 0.882
momentum: 0.948
weight_decay: 0.00027
warmup_epochs: 0.99
box: 9.83
cls: 0.65
dfl: 0.96

# Domain-aware augmentation:
# keep useful scale/color variation while avoiding unrealistic geometry.
# mosaic kept low: DiVat/DiVatLoiLom/LoiChi/LoiTray boxes are already tiny,
# and mosaic's 4-way composite shrinks them further before resize.
mosaic: 0.30
close_mosaic: 10
mixup: 0.05
copy_paste: 0.0
scale: 0.50
translate: 0.10
fliplr: 0.50
flipud: 0.0
degrees: 0.0
shear: 0.0
perspective: 0.0
hsv_h: 0.013
hsv_s: 0.353
hsv_v: 0.194

# Artifacts
plots: true
save: true
save_period: -1
val: true
verbose: true
