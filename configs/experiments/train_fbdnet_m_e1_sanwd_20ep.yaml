# Experiment E1: FBDNet-M Fine-Tuning with Scale-Aware NWD Auxiliary Loss (20 epochs)
# Scientific Hypothesis Verification: Small-Object Bottleneck in Glass Defect Inspection
# Model: FBDNet-M (HGNetv2FBD + FBDHybridEncoder + DFINETransformer)
# Dataset: Glass Defect Dataset Scale_Error_DC v26 (5 classes: DiVat, DiVatLoiLom, LoiChi, LoiNhua, LoiTray)
# Pretrained checkpoint: weights/dfine_m_fbdnet_best.pth (epoch 89, mAP50:95 = 42.42%)
# Optimization: Fresh AdamW optimizer and scheduler, no resume of optimizer state
# Localization Loss: Standard D-FINE (L1 + GIoU + FGL + VFL) + Scale-Aware NWD

experiment_id: E1_fbdnet_m_sanwd_20ep
model_name: FBDNet-M
use_nwd: true

nwd:
  lambda_weight: 0.2
  c_px: 16.0
  scale_aware: true
  tau_px: 32.0
  alpha_scale: 1.0
  min_weight: 0.5
  max_weight: 2.0
  img_size: [960, 960]

dfine_config: results/D-FINE/configs/dfine/custom/fbdnet_m_e1_sanwd_20ep.yml
pretrained_weights: weights/dfine_m_fbdnet_best.pth
output_dir: runs/experiments/fbdnet_m_e1_sanwd_20ep

seed: 42
epochs: 20
batch_size: 8
image_size: [960, 960]
eval_size: [960, 960]

optimizer:
  type: AdamW
  lr: 0.00025
  backbone_lr: 0.000025
  weight_decay: 0.000125
  betas: [0.9, 0.999]

stop_augment_epoch: 15
